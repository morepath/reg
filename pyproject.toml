[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "reg"
version = "1.0.1.dev0"
dynamic = ["readme"]
description = "Clever dispatch"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{name = "Martijn Faassen", email = "faassen@startifact.com"}]
maintainers = [{name = "Henri Hulski", email = "henri@sancode.it"}]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 5 - Production/Stable",
]
requires-python = ">= 3.11"

[project.urls]
Documentation = "https://reg.readthedocs.io"
Repository = "https://github.com/morepath/reg"
Issues = "https://github.com/morepath/reg/issues"
Changelog = "https://github.com/morepath/reg/blob/master/CHANGES.txt"

[project.optional-dependencies]
test = ["pytest >= 8", "pytest-env"]
coverage = ["pytest-cov"]
lint = ["ruff"]
# NOTE: sphinx 9.1 introduced PEP-695 syntax into the code-base, so we
#       can't type check in pre-3.12 mode this way, which we need to,
#       as long as we still support these versions.
docs = ["sphinx < 9.1"]
mypy = ["mypy", "pytest"]
pyright = ["pyright", "pytest"]

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
reg = ["py.typed"]

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.txt"]}

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["reg"]
addopts = ["-vv"]
env = ["RUN_ENV=test"]

[tool.coverage.run]
omit = ["reg/tests/*", "reg/types.py"]
source = ["reg"]

[tool.coverage.report]
show_missing = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TC", "UP", "RUF"]
ignore = ["E501", "E731"]
future-annotations = true

[tool.ruff.lint.isort]
extra-standard-library = ["typing_extensions"]
known-first-party = ["dectate", "importscan", "reg"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["."]
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pyright]
typeCheckingMode = "strict"

[tool.tox]
requires = ["tox>=4"]
env_list = [
    "py311",
    "py312",
    "py313",
    "py314",
    "py315",
    "pypy3",
    "coverage",
    "lint",
    "docs",
    "perf",
    "mypy",
    "pyright",
]
skip_missing_interpreters = true

[tool.tox.gh.python]
"3.11" = ["py311"]
"3.12" = ["py312"]
"3.13" = ["py313"]
"3.14" = ["py314", "coverage", "lint", "mypy", "pyright", "perf"]
"3.15" = ["py315"]
"pypy-3.12" = ["pypy3"]

[tool.tox.env_run_base]
package = "editable"
extras = ["test", "docs"]
commands = [["pytest", "{posargs:reg}"]]

[tool.tox.env.coverage]
base_python = ["python3"]
extras = ["test", "coverage", "docs"]
commands = [
    ["pytest", "--cov", "--cov-fail-under=100", "{posargs:reg}"],
]

[tool.tox.env.lint]
base_python = ["python3.14"]
extras = ["lint"]
commands = [
    ["ruff", "check", "."],
    ["ruff", "format", "--check", "."],
]

[tool.tox.env.docs]
base_python = ["python3"]
extras = ["docs"]
commands = [
    ["sphinx-build", "-W", "-b", "doctest", "doc", "{env_tmp_dir}"],
    ["sphinx-build", "-W", "-b", "html", "doc", "{env_tmp_dir}"],
]

[tool.tox.env.perf]
base_python = ["python3"]
extras = []
commands = [
    ["python", "{toxinidir}/tox_perf.py"],
]

[tool.tox.env.mypy]
base_python = ["python3"]
extras = ["mypy", "docs"]
commands = [
    ["mypy", "--python-version", "3.11"],
    ["mypy", "--python-version", "3.12"],
    ["mypy", "--python-version", "3.13"],
    ["mypy", "--python-version", "3.14"],
    ["mypy", "--python-version", "3.15"],
]

[tool.tox.env.pyright]
base_python = ["python3"]
extras = ["pyright", "docs"]
commands = [
    ["pyright", "--pythonversion", "3.11"],
    ["pyright", "--pythonversion", "3.12"],
    ["pyright", "--pythonversion", "3.13"],
    ["pyright", "--pythonversion", "3.14"],
    ["pyright", "--pythonversion", "3.15"],
]

[tool.zest-releaser]
release = false
upload-pypi = false
tag-format = "v{version}"
